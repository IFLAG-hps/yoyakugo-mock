<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多言語管理｜管理画面モック</title>

  <!-- Material Design Components CSS -->
  <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Material Design Components JavaScript -->
  <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
  <link href="./style.css" rel="stylesheet">
  <style>
    /* 多言語管理ページ専用スタイル */
    .search-form-label {
      width: 200px !important;
      min-width: 200px;
    }

    .search-form-input.checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: center;
    }

    .search-form-input.checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .search-form-input.checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .search-form-row {
        flex-direction: column;
        align-items: stretch;
      }

      .search-form-label {
        width: 100% !important;
        min-width: unset;
      }

      .search-form-input.checkbox-group {
        flex-direction: column;
        align-items: flex-start;
      }

    }

    .has-error {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="./logo.png" alt="TryServ" style="width: 150px; height: auto;">
        <div>
          <span style="font-size:12px;color:#9fb6ff">受付・予約管理システム</span><br />
          <strong>管理者太郎</strong>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="./admin_index.html" data-target="dashboard">📊 ダッシュボード</a>
        <a href="./admin_reservations.html" data-target="reservations">📅 受付・予約管理</a>
        <a href="./admin_customers.html" data-target="customers">👥 顧客管理</a>
        <a href="./admin_menus.html" data-target="menus">🛠 メニュー管理</a>
        <a href="./admin_resources.html" data-target="resources">💺 リソース管理</a>
        <a href="./admin_users.html" data-target="users">👫 スタッフ管理</a>
        <a href="./admin_setting.html" data-target="settings">⚙ 基本設定</a>
        <a href="./admin_multilang_manage.html" data-target="multilang" class="active">🌐 多言語管理</a>
      </nav>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="main-section">

        <div class="main-header">
          <h2 class="main-title">🌐 多言語管理</h2>
        </div>

        <div class="tab-content-container">
          <div id="errorPop" style="overflow: visible; display: block;">
            <ul id="errorList" style="margin:0px 0px 0px 20px">
              <li id="error-txtIndustryInfo" style="color: red;display: none;">業界情報エラー</li>
              <li id="error-txtFacilityInfo" style="color: red;display: none;">施設・店舗情報エラー</li>
            </ul>
          </div>
          <div class="tab-content active" id="tab-multilang">
            <div class="setting-form-section">
              <form id="multilangForm" name="multilangForm" method="post">
                <div class="search-form-content">
                  <div class="search-form-grid-setting">
                    <div class="search-form-row">
                      <div class="search-form-label">業界情報</div>
                      <div class="search-form-input">
                        <textarea rows="6" id="txtIndustryInfo" name="txtIndustryInfo" class="form-textarea-small"
                          placeholder="業界情報を入力してください（例：医療・福祉、美容・理容、飲食など）"></textarea>
                      </div>
                    </div>

                    <div class="search-form-row">
                      <div class="search-form-label">施設・店舗情報</div>
                      <div class="search-form-input">
                        <textarea rows="6" id="txtFacilityInfo" name="txtFacilityInfo" class="form-textarea-small"
                          placeholder="施設・店舗情報を入力してください（例：店舗名、住所、アクセス、特徴など）"></textarea>
                      </div>
                    </div>

                    <div class="search-form-row">
                      <div class="search-form-label">表示言語</div>
                      <div class="search-form-input checkbox-group">
                        <label>
                          <input type="checkbox" id="chkLangEn" name="chkLang" value="en">
                          <span>英語</span>
                        </label>
                        <label>
                          <input type="checkbox" id="chkLangZhCn" name="chkLang" value="zh-CN">
                          <span>中国語（簡体字）</span>
                        </label>
                        <label>
                          <input type="checkbox" id="chkLangZhTw" name="chkLang" value="zh-TW">
                          <span>中国語（繁体字）</span>
                        </label>
                        <label>
                          <input type="checkbox" id="chkLangKo" name="chkLang" value="ko">
                          <span>韓国語</span>
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="search-form-actions">
                    <button type="submit" id="btnSaveMultilang" name="btnSaveMultilang" class="search-btn">保存</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    document.getElementById('multilangForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // 登録処理はバックエンド連携時に実装
      alert('保存しました。（モック）');
    });
    // txtIndustryInfo,txtFacilityInfoのフォーカスが外れた時データがない場合エラーを表示する（デザイン確認のため）
    document.getElementById('txtIndustryInfo').addEventListener('blur', function () {
      if (document.getElementById('txtIndustryInfo').value.trim() === '') {
        document.getElementById('error-txtIndustryInfo').style.display = 'block';
        document.getElementById('txtIndustryInfo').classList.add('has-error');
      } else {
        document.getElementById('error-txtIndustryInfo').style.display = 'none';
        document.getElementById('txtIndustryInfo').classList.remove('has-error');
      }
    });
    document.getElementById('txtFacilityInfo').addEventListener('blur', function () {
      if (document.getElementById('txtFacilityInfo').value.trim() === '') {
        document.getElementById('error-txtFacilityInfo').style.display = 'block';
        document.getElementById('txtFacilityInfo').classList.add('has-error');
      } else {
        document.getElementById('error-txtFacilityInfo').style.display = 'none';
        document.getElementById('txtFacilityInfo').classList.remove('has-error');
      }
    });
    // txtIndustryInfo,txtFacilityInfoのフォーカスでエラー表示を削除する
    document.getElementById('txtIndustryInfo').addEventListener('focus', function () {
      document.getElementById('error-txtIndustryInfo').style.display = 'none';
      document.getElementById('txtIndustryInfo').classList.remove('has-error');
    });
    document.getElementById('txtFacilityInfo').addEventListener('focus', function () {
      document.getElementById('error-txtFacilityInfo').style.display = 'none';
      document.getElementById('txtFacilityInfo').classList.remove('has-error');
    });
  </script>
</body>

</html>
