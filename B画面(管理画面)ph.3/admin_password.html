<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>パスワード変更｜管理画面モック</title>
  <link href="./style.css" rel="stylesheet">
  <style>
    /* パスワード入力フィールドのスタイル */
    .password-input-group {
      display: flex;
      align-items: center;
      position: relative;
    }

    .password-input-group .form-input {
      flex: 1;
      padding-right: 40px;
    }

    .password-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      z-index: 10;
    }

    .password-toggle-btn:hover {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }

    .form-help {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #666;
    }

    /* パスワード非表示アイコン（目のアイコンに斜め線） */
    .password-hidden {
      position: relative;
      display: inline-block;
      font-size: 16px;
    }

    .password-hidden::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 2px;
      background: #666;
      transform: translate(-50%, -50%) rotate(45deg);
      border-radius: 1px;
    }

    /* パスワード表示アイコン（通常の目のアイコン） */
    .password-visible {
      font-size: 16px;
    }

    /* パスワード強度インジケーター */
    .password-strength-container {
      display: block;
      width: 100%;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .password-strength-bar {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .password-strength-fill {
      height: 100%;
      width: 0%;
      transition: all 0.3s ease;
      border-radius: 3px;
    }

    .password-strength-fill.none {
      width: 0%;
      background: #9ca3af;
    }

    .password-strength-fill.weak {
      width: 33%;
      background: #ef4444;
    }

    .password-strength-fill.medium {
      width: 66%;
      background: #f59e0b;
    }

    .password-strength-fill.strong {
      width: 100%;
      background: #10b981;
    }

    .password-strength-text {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }

    .password-strength-text.none {
      color: #000000;
    }

    .password-strength-text.weak {
      color: #ef4444;
    }

    .password-strength-text.medium {
      color: #f59e0b;
    }

    .password-strength-text.strong {
      color: #10b981;
    }

    /* パスワード条件チェックリスト */
    .password-conditions {
      display: block;
      width: 100%;
      margin-top: 0;
      padding: 12px;
      background: #f2f2f2;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      box-sizing: border-box;
      clear: both;
    }

    .password-condition-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    /* パスワード強度表示エリア全体を縦並びに */
    .search-form-input .password-strength-container,
    .search-form-input .password-conditions {
      flex-basis: 100%;
    }

    /* パスワード強度表示エリアのsearch-form-inputを縦並びに強制 */
    .search-form-row .search-form-input:has(.password-strength-container) {
      display: flex !important;
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 0 !important;
      max-width: 40% !important;
    }

    .password-condition-item:last-child {
      margin-bottom: 0;
    }

    .password-condition-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e5e7eb;
      color: #9ca3af;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .password-condition-item.valid .password-condition-icon {
      background: #10b981;
      color: white;
    }

    .password-condition-item.valid .password-condition-text {
      color: #000000;
    }

    .password-condition-item .password-condition-text {
      color: #000000;
      transition: color 0.2s ease;
    }

    /* パスワード変更ボタンの無効状態 */
    #changePasswordBtn:disabled {
      background: #d1d5db !important;
      color: #9ca3af !important;
      cursor: not-allowed !important;
      opacity: 0.6;
    }

    #changePasswordBtn:disabled:hover {
      background: #d1d5db !important;
      transform: none !important;
    }
  </style>
</head>
<body>

    <!-- Main -->
    <main class="main">
        <div class="main-section">
          <div class="main-header">
            <h3 class="main-title">🔐 パスワード変更</h3>
          </div>
            <div class="setting-form-section">
                <form id="passwordChangeForm" name="passwordChangeForm" method="post">
                    <div class="search-form-content">
                        <div class="search-form-grid-setting">
                            <div class="search-form-row">
                                <div class="search-form-label">現在のパスワード</div>
                                <div class="search-form-input">
                                    <div class="password-input-group">
                                        <input type="password" id="currentPassword" name="currentPassword" class="form-input" placeholder="現在のパスワードを入力">
                                        <button type="button" class="password-toggle-btn" onclick="togglePassword('currentPassword', 'currentPasswordToggle')">
                                            <span id="currentPasswordToggle" class="password-hidden">👁</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="search-form-row">
                                <div class="search-form-label">新しいパスワード</div>
                                <div class="search-form-input">
                                    <div class="password-input-group">
                                        <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="新しいパスワードを入力">
                                        <button type="button" class="password-toggle-btn" onclick="togglePassword('newPassword', 'newPasswordToggle')">
                                            <span id="newPasswordToggle" class="password-hidden">👁</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- パスワード強度表示エリア -->
                            <div class="search-form-row">
                                <div class="search-form-label"></div>
                                <div class="search-form-input">
                                    <!-- パスワード強度インジケーター -->
                                    <div class="password-strength-container" id="passwordStrengthContainer" style="display: none;">
                                        <div class="password-strength-bar">
                                            <div class="password-strength-fill" id="passwordStrengthFill"></div>
                                        </div>
                                        <div class="password-strength-text" id="passwordStrengthText">パスワード強度：入力してください</div>
                                    </div>

                                    <!-- パスワード条件チェックリスト -->
                                    <div class="password-conditions">
                                        <div class="password-condition-item" data-condition="validCharacterCount">
                                            <span class="password-condition-icon">✓</span>
                                            <span class="password-condition-text">12文字以上</span>
                                        </div>
                                        <div class="password-condition-item" data-condition="validCharacterType">
                                            <span class="password-condition-icon">✓</span>
                                            <span class="password-condition-text">半角文字以外を利用しない</span>
                                        </div>
                                        <div class="password-condition-item" data-condition="requiredCharacterType">
                                            <span class="password-condition-icon">✓</span>
                                            <span class="password-condition-text">英大文字、英小文字、数字、記号から3種類以上の利用</span>
                                        </div>
                                        <div class="password-condition-item" data-condition="invalidWord">
                                            <span class="password-condition-icon">✓</span>
                                            <span class="password-condition-text">日付や「password」など簡単に推測できる文字を用いていない</span>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div class="search-form-row">
                                <div class="search-form-label">新しいパスワード（確認用）</div>
                                <div class="search-form-input">
                                    <div class="password-input-group">
                                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="新しいパスワードを再入力">
                                        <button type="button" class="password-toggle-btn" onclick="togglePassword('confirmPassword', 'confirmPasswordToggle')">
                                            <span id="confirmPasswordToggle" class="password-hidden">👁</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="search-form-actions">
                            <button type="submit" id="changePasswordBtn" name="changePasswordBtn" class="link-btn" disabled>パスワードを変更</button>

                        </div>

  <script>
    // パスワード表示/非表示の切り替え
    function togglePassword(inputId, toggleId) {
        const input = document.getElementById(inputId);
        const toggle = document.getElementById(toggleId);

        if (input.type === 'password') {
            input.type = 'text';
            toggle.textContent = '👁';
            toggle.className = 'password-visible';
        } else {
            input.type = 'password';
            toggle.textContent = '👁';
            toggle.className = 'password-hidden';
        }
    }

    // フォームクリア
    function clearForm() {
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';

        // パスワード表示をリセット
        document.getElementById('currentPassword').type = 'password';
        document.getElementById('newPassword').type = 'password';
        document.getElementById('confirmPassword').type = 'password';
        document.getElementById('currentPasswordToggle').textContent = '👁';
        document.getElementById('currentPasswordToggle').className = 'password-hidden';
        document.getElementById('newPasswordToggle').textContent = '👁';
        document.getElementById('newPasswordToggle').className = 'password-hidden';
        document.getElementById('confirmPasswordToggle').textContent = '👁';
        document.getElementById('confirmPasswordToggle').className = 'password-hidden';

        // パスワード強度表示をリセット
        const strengthContainer = document.getElementById('passwordStrengthContainer');
        if (strengthContainer) {
            strengthContainer.style.display = 'none';
        }

        // パスワード条件チェックをリセット
        const conditionItems = document.querySelectorAll('.password-condition-item');
        conditionItems.forEach(item => {
            item.classList.remove('valid');
        });

        // ボタンを無効化（初期状態に戻す）
        const changeBtn = document.getElementById('changePasswordBtn');
        if (changeBtn) {
            changeBtn.setAttribute('disabled', 'disabled');
        }
    }

    // パスワード強度チェック機能
    let passwordCheckTimer = 0;

    // DOMContentLoaded時に新しいパスワード入力欄のイベントリスナーを設定
    document.addEventListener('DOMContentLoaded', function() {
        const newPasswordInput = document.getElementById('newPassword');
        if (newPasswordInput) {
            newPasswordInput.addEventListener('blur', checkPasswordStrength);
            newPasswordInput.addEventListener('keyup', setPasswordCheckTimer);

            // 初期チェック
            checkPasswordStrength();
        }
    });

    // タイマーをセット（2秒後にチェック）
    function setPasswordCheckTimer() {
        if (passwordCheckTimer === 1) return;
        passwordCheckTimer = 1;
        setTimeout(checkPasswordStrength, 2000);
    }

    // パスワード強度チェック
    function checkPasswordStrength() {
        passwordCheckTimer = 0;
        const password = document.getElementById('newPassword').value;

        // 強度判定
        const result = validatePassword(password);

        // パスワード条件の表示制御
        updatePasswordConditions(result.conditions);

        // パスワード強度の表示制御
        updatePasswordStrengthDisplay(result.score, result.conditions);
    }

    // パスワード検証ロジック（メールパスワードと同じ）
    function validatePassword(password) {
        const result = {
            conditions: {
                validCharacterCount: 0,     // 12文字以上
                validCharacterType: 0,      // 半角文字以外を利用しない
                requiredCharacterType: 0,   // 英大文字、英小文字、数字、記号から3種類以上の利用
                invalidWord: 0              // 日付や「password」など簡単に推測できる文字を用いていない
            },
            score: 0
        };

        // 1. 文字数チェック（12文字以上、32文字以下）
        if (password.length >= 12 && password.length <= 32) {
            result.conditions.validCharacterCount = 1;
            result.score += 1;
        }

        // 2. 半角文字チェック（メールパスワードで使用可能な文字のみ）
        // 使用可能な文字: @!"#$%'()*+,-./0-9:;<=>?A-Z[\]^_a-z{|}~
        const validChars = /^[@!"#$%'()*+,\-./0-9:;<=>?A-Z\[\\\]^_a-z{|}~]+$/;
        if (validChars.test(password)) {
            result.conditions.validCharacterType = 1;
            result.score += 1;
        }

        // 3. 文字種カウント（英大文字、英小文字、数字、記号から3種類以上）
        let typeCount = 0;
        const hasLowercase = /[a-z]/.test(password);
        const hasUppercase = /[A-Z]/.test(password);
        const hasNumber = /[0-9]/.test(password);
        const hasSymbol = /[@!"#$%'()*+,\-./:;<=>?[\\\]^_{|}~]/.test(password);

        if (hasLowercase) typeCount++;
        if (hasUppercase) typeCount++;
        if (hasNumber) typeCount++;
        if (hasSymbol) typeCount++;

        if (typeCount >= 3) {
            result.conditions.requiredCharacterType = 1;
            result.score += 1;
        }

        // 4. NGワードチェック（簡易版）
        // パスワードが空でない場合のみチェック
        if (password.length > 0) {
            const ngWords = ['password', 'Password', 'PASSWORD', '12345', '123456', 'qwerty', 'asdfgh'];
            let hasNgWord = false;
            for (let i = 0; i < ngWords.length; i++) {
                if (password.indexOf(ngWords[i]) !== -1) {
                    hasNgWord = true;
                    break;
                }
            }
            // 日付パターン（YYYYMMDD, YYYY/MM/DD, YYYY-MM-DD）
            const datePattern = /\d{4}[\/\-]?\d{2}[\/\-]?\d{2}/;
            if (datePattern.test(password)) {
                hasNgWord = true;
            }

            if (!hasNgWord) {
                result.conditions.invalidWord = 1;
                result.score += 1;
            }
        }

        // 注: スコアの最大値は4点（全条件を満たした場合）

        return result;
    }

    // パスワード条件表示の更新（メールパスワードと同じロジック）
    function updatePasswordConditions(conditions) {
        // 各条件をループ処理
        Object.keys(conditions).forEach(function(conditionKey) {
            const conditionValue = conditions[conditionKey];
            const conditionItem = document.querySelector('.password-condition-item[data-condition="' + conditionKey + '"]');

            if (conditionItem) {
                if (conditionValue === 1) {
                    conditionItem.classList.add('valid');
                } else {
                    conditionItem.classList.remove('valid');
                }
            }
        });
    }

    // パスワード強度表示の更新（メールパスワードと同じロジック）
    function updatePasswordStrengthDisplay(score, conditions) {
        const strengthContainer = document.getElementById('passwordStrengthContainer');
        const strengthFill = document.getElementById('passwordStrengthFill');
        const strengthText = document.getElementById('passwordStrengthText');
        const changeBtn = document.getElementById('changePasswordBtn');

        if (!strengthContainer || !strengthFill || !strengthText) return;

        // コンテナを表示
        strengthContainer.style.display = 'block';

        let strengthType = 'none';
        let strengthLabel = 'パスワード強度：入力してください';
        let isValid = false;

        // メールパスワードと同じロジック
        if (conditions.validCharacterCount == 0) {
            // 文字数エラーは[パスワード強度：なし]
            strengthType = 'none';
            strengthLabel = 'パスワード強度：入力してください';
            isValid = false;
        } else if (score < 3) {
            // パスワード強度ポイント [3未満] は [パスワード強度：低]
            strengthType = 'weak';
            strengthLabel = 'パスワード強度：低';
            isValid = false;
        } else if (score == 3) {
            // パスワード強度ポイント [3] は [パスワード強度：中]
            strengthType = 'medium';
            strengthLabel = 'パスワード強度：中';
            isValid = false;
        } else if (score >= 4) {
            // パスワード強度ポイント [4以上] は [パスワード強度：高]
            strengthType = 'strong';
            strengthLabel = 'パスワード強度：高';
            isValid = true;
        } else {
            // 考慮外は[パスワード強度：なし]
            strengthType = 'none';
            strengthLabel = 'パスワード強度：入力してください';
            isValid = false;
        }

        // クラスをリセット
        strengthFill.className = 'password-strength-fill ' + strengthType;
        strengthText.className = 'password-strength-text ' + strengthType;
        strengthText.textContent = strengthLabel;

        // ボタンの有効/無効制御
        if (changeBtn) {
            if (isValid) {
                changeBtn.removeAttribute('disabled');
            } else {
                changeBtn.setAttribute('disabled', 'disabled');
            }
        }
    }

    // パスワード変更フォームの送信処理
    document.getElementById('passwordChangeForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // パスワード変更処理（実際の実装ではAPIに送信）
        console.log('パスワード変更:', {
            currentPassword: currentPassword,
            newPassword: newPassword
        });

        // admin_index.htmlへ遷移
        window.location.href = './admin_index.html';
    });

    // ====== モーダル ======
    function openNewReservation(){document.getElementById('newResv').showModal();}
    function closeNewReservation(){document.getElementById('newResv').close();}
    function openCustomer(){document.getElementById('customer').showModal();}
    function notifyDemo(){alert('新規予約 1件 / キャンセル 1件');}

    // ====== 簡易チャート描画（素のCanvas） ======
    function drawBar(canvasId, values){
      const c = document.getElementById(canvasId); if(!c) return; const ctx = c.getContext('2d');
      const w=c.width=c.clientWidth, h=c.height=c.clientHeight; const pad=20; const max=Math.max(...values,10);
      const bw=(w - pad*2)/values.length*0.7; const step=(w - pad*2)/values.length;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#dbeafe';
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#1e90ff';
      values.forEach((v,i)=>{
        const x=pad+i*step + (step-bw)/2; const barH=(h-pad*2)*v/max; const y=h-pad-barH;
        ctx.fillRect(x,y,bw,barH);
      });
    }
    function drawLine(canvasId, values){
      const c=document.getElementById(canvasId); if(!c) return; const ctx=c.getContext('2d');
      const w=c.width=c.clientWidth, h=c.height=c.clientHeight; const pad=20; const max=Math.max(...values,10);
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='#1e90ff'; ctx.resourceWidth=2; ctx.beginPath();
      values.forEach((v,i)=>{const x=pad+i*(w-2*pad)/(values.length-1); const y=h-pad-(h-2*pad)*v/max; i?ctx.resourceTo(x,y):ctx.moveTo(x,y)});
      ctx.stroke();
    }
    window.addEventListener('load',()=>{
      drawBar('chart1',[22,18,25,30,28,35,42,44,38,27,24,35]);
      drawLine('chart2',[6,8,7,9,7,6,8,7,6,7,7,7]);
      drawBar('chart3',[54,21,17,8]);
    });
  </script>
