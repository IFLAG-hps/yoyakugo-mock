        <!-- Main -->
        <main class="main">
            <!-- リソース並び替えセクション -->
            <div class="resource-sort-section">
                <div class="main-header">
                    <h3 class="main-title">💺 リソース並び替え</h3>
                    <button type="button" class="back-btn" onclick="goBack()">← 戻る</button>
                </div>

                <div class="sort-container">
                    <div class="sort-info">
                        <p>リソースをドラッグ&ドロップで並び替えることができます。</p>
                    </div>

                    <div class="resource-list" id="resourceList">
                        <!-- リソースアイテムがここに動的に追加されます -->
                    </div>

                    <div class="sort-actions">
                        <button type="button" class="form-btn modal-btn-save"
                            onclick="saveSortOrder()">並び替えを保存</button>
                        <button type="button" class="form-btn form-btn-cancel" onclick="goBack()">閉じる</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // サンプルリソースデータ
        const sampleLines = [
            {id: 1, name: 'チェアA', description: 'チェアAのリソース', webReception: 'ON', updateDate: '2025-01-15'},
            {id: 2, name: 'チェアB', description: 'チェアBのリソース', webReception: 'ON', updateDate: '2025-01-14'},
            {id: 3, name: 'チェアC', description: 'チェアCのリソース', webReception: 'OFF', updateDate: '2025-01-13'},
            {id: 4, name: 'チェアD', description: 'チェアDのリソース', webReception: 'ON', updateDate: '2025-01-12'},
            {id: 5, name: 'チェアE', description: 'チェアEのリソース', webReception: 'ON', updateDate: '2025-01-11'}
        ];

        let draggedElement = null;

        // ページ読み込み時にリソースリストを初期化
        document.addEventListener('DOMContentLoaded', function () {
            initializeLineList();
        });

        // リソースリストを初期化
        function initializeLineList() {
            const resourceList = document.getElementById('resourceList');
            resourceList.innerHTML = '';

            sampleLines.forEach((resource, index) => {
                const resourceItem = createLineItem(resource, index + 1);
                resourceList.appendChild(resourceItem);
            });
        }

        // リソースアイテムを作成
        function createLineItem(resource, order) {
            const resourceItem = document.createElement('div');
            resourceItem.className = 'drag-item';
            resourceItem.draggable = true;
            resourceItem.dataset.resourceId = resource.id;

            resourceItem.innerHTML = `
            <div class="drag-handle">⋮⋮</div>
            <div class="drag-info">
                <div class="drag-name">${resource.name}</div>
                <div class="drag-details">${resource.description} | WEB受付: ${resource.webReception} | 更新日: ${resource.updateDate}</div>
            </div>
            <div class="drag-order">${order}</div>
        `;

            // ドラッグイベントを追加
            resourceItem.addEventListener('dragstart', handleDragStart);
            resourceItem.addEventListener('dragend', handleDragEnd);
            resourceItem.addEventListener('dragover', handleDragOver);
            resourceItem.addEventListener('drop', handleDrop);

            return resourceItem;
        }

        // ドラッグ開始
        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.outerHTML);
        }

        // ドラッグ終了
        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedElement = null;

            // すべてのdrag-overクラスを削除
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('drag-over');
            });
        }

        // ドラッグオーバー
        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }

            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');

            return false;
        }

        // ドロップ
        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (draggedElement !== this) {
                const resourceList = document.getElementById('resourceList');
                const draggedIndex = Array.from(resourceList.children).indexOf(draggedElement);
                const targetIndex = Array.from(resourceList.children).indexOf(this);

                if (draggedIndex < targetIndex) {
                    resourceList.insertBefore(draggedElement, this.nextSibling);
                } else {
                    resourceList.insertBefore(draggedElement, this);
                }

                // 順序番号を更新
                updateOrderNumbers();
            }

            this.classList.remove('drag-over');
            return false;
        }

        // 順序番号を更新
        function updateOrderNumbers() {
            const resourceItems = document.querySelectorAll('.resource-item');
            resourceItems.forEach((item, index) => {
                const orderElement = item.querySelector('.resource-order');
                orderElement.textContent = index + 1;
            });
        }

        // 並び替えを保存
        function saveSortOrder() {
            const resourceItems = document.querySelectorAll('.resource-item');
            const newOrder = Array.from(resourceItems).map(item => ({
                id: parseInt(item.dataset.resourceId),
                order: Array.from(resourceItems).indexOf(item) + 1
            }));

            // ここで実際の保存処理を行う
            // 例: APIに送信、ローカルストレージに保存など

            // リソース管理画面に戻る
            window.location.href = './admin_resources.html';
        }

        // 戻るボタンの処理
        function goBack() {
            window.history.back();
        }
    </script>
</body>

</html>
